name: Rename game to Trump Among Us
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rename-trump-among-us.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: trump-among-us-rename
  cancel-in-progress: false
jobs:
  rename:
    if: github.repository == 'Martin-Hausleitner/OVAL-SUS'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply source-checked branding changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path('index.html')
          s = p.read_text()
          expected = 'b83dc506beafa42263782b490f0688036e0b4c7e8345f6726ffa7b857d54ece9'
          assert hashlib.sha256(p.read_bytes()).hexdigest() == expected, 'Source changed: review before renaming'
          changes = [
              ('OVAL SUS', 'Trump Among Us', 3),
              ('<h1>Ein Haus.<br><em>Viele Verdächtige.</em></h1>', '<h1>Trump<br><em>Among Us</em></h1>', 1),
              ('<h1>Alle im Haus.<br><em>Niemand sicher.</em></h1>', '<h1>Trump<br><em>Among Us</em></h1>', 1),
              ("a.download='OVAL-SUS-'", "a.download='Trump-Among-Us-'", 1),
              ('content="Ein satirisches Offline-Social-Deduction-Minispiel.', 'content="Trump Among Us: Ein satirisches Offline-Social-Deduction-Minispiel.', 1),
              ('aria-label="Zur Lobby"', 'aria-label="Trump Among Us – zur Lobby"', 1),
          ]
          for old, new, count in changes:
              assert s.count(old) == count, (old, s.count(old), count)
              s = s.replace(old, new)
          css = '''
          /* Longer product name; preserve the existing responsive navigation. */
          .brand b{font-size:20px;letter-spacing:.1px;white-space:nowrap}
          @media(max-width:820px){.brand b{font-size:15px;letter-spacing:-.2px}}
          @media(max-width:360px){.brand b{font-size:13px;letter-spacing:-.4px}.brand small{letter-spacing:.75px}}
          '''
          assert s.count('</style>') == 1
          s = s.replace('</style>', css + '</style>')
          assert "const STORAGE='oval-sus-v1'" in s
          assert 'OVAL SUS' not in s
          p.write_text(s)
          assert hashlib.sha256(p.read_bytes()).hexdigest() == 'a538fb95c5e699e264bfa89383108e049bc733dabcbba6c93c95244e9ba633bf'
          p = Path('README.md')
          s = p.read_text().replace('# OVAL SUS — Miniature Edition', '# Trump Among Us — Miniature Edition', 1)
          s = s.replace('Die Bilder wurden für diesen Publish aus der unveränderten Anwendung mit Chrome auf macOS aufgenommen.', 'Die Bilder wurden nach der Umbenennung aus der laufenden Anwendung mit Headless Google Chrome unter Linux neu aufgenommen. Es sind echte Browser-Screenshots, keine generierten Bilder.', 1)
          s = s.replace('**Der Spielcode ist byte-identisch mit `OVAL-SUS-Miniature-Edition.html` aus dem Chat.**', '**Das Spiel heißt jetzt Trump Among Us.** Browser-Titel, Kopfzeile, Startbildschirm, Beschreibung und PNG-Dateinamen wurden angepasst. Spielmechanik und der vorhandene lokale Speicherschlüssel bleiben erhalten. Der Repository-Pfad und die Spieladresse bleiben unverändert, damit bestehende Links weiter funktionieren. Die ursprüngliche Chat-Datei und ihre Prüfsumme sind historische Herkunftsnachweise; die aktuelle Prüfsumme steht in `SHA256SUMS`.', 1)
          s += '\n## Umbenennung geprüft\n\nDie Branding-Prüfung kontrolliert Titel, Startbildschirm und überlappungsfreie Navigation bei 320, 360, 390, 844, 1440 und 1920 Pixel Breite. [Prüfbericht](evidence/rename-branding.json). Der oben verlinkte Publish-Test wurde nach der Änderung erneut ausgeführt.\n'
          p.write_text(s)
          p = Path('evidence/README.md')
          s = p.read_text()
          s += '\n## Trump Among Us — Branding-Update\n\n`publish-smoke-local.json` und die Screenshots wurden nach der Umbenennung in Headless Google Chrome auf dem Linux-CI-Runner neu erstellt. `rename-branding.json` prüft zusätzlich sechs Bildschirmbreiten. `source-provenance.json` und der erste Testlauf bleiben unveränderte historische Herkunftsnachweise der ursprünglichen Miniature Edition. Der lokale Speicherschlüssel wurde absichtlich beibehalten.\n'
          p.write_text(s)
          PY
      - name: Install browser test tooling
        shell: bash
        run: |
          python3 -m pip install playwright==1.55.0
          command -v google-chrome || python3 -m playwright install --with-deps chrome
      - name: Re-run game smoke tests and capture fresh screenshots
        run: python3 tests/smoke.py
      - name: Verify branding at six viewport sizes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          import datetime, hashlib, json
          root = Path.cwd()
          checks, errors = [], []
          with sync_playwright() as pw:
              browser = pw.chromium.launch(channel='chrome', headless=True)
              version = browser.version
              for width, height in [(320,740),(360,800),(390,844),(844,390),(1440,900),(1920,1080)]:
                  context = browser.new_context(viewport={'width':width,'height':height}, device_scale_factor=1)
                  page = context.new_page()
                  page.on('pageerror', lambda e: errors.append(str(e)))
                  page.goto((root/'index.html').as_uri()+'?test=1')
                  page.wait_for_function('!!window.__OVAL_TEST__')
                  assert page.title() == 'Trump Among Us — Miniature Edition'
                  assert page.locator('#brandBtn b').inner_text() == 'Trump Among Us'
                  assert page.locator('#lobbyHero h1').inner_text().replace('\n',' ').strip() == 'Trump Among Us'
                  bounds = page.evaluate("""()=>{const rect=s=>{const r=document.querySelector(s).getBoundingClientRect();return {left:r.left,right:r.right}};return {brand:rect('.brand'),nav:rect('.nav'),tools:rect('.topright'),scroll:document.documentElement.scrollWidth}}""")
                  assert bounds['scroll'] <= width + 1, (width,bounds)
                  assert bounds['brand']['right'] <= bounds['nav']['left'] + 1, (width,bounds)
                  assert bounds['nav']['right'] <= bounds['tools']['left'] + 1, (width,bounds)
                  checks.append({'width':width,'height':height,'pass':True,'bounds':bounds})
                  context.close()
              browser.close()
          assert not errors, errors
          report = {'name':'Trump Among Us','generated_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'browser':'Google Chrome '+version,'source_sha256':'b83dc506beafa42263782b490f0688036e0b4c7e8345f6726ffa7b857d54ece9','renamed_sha256':hashlib.sha256((root/'index.html').read_bytes()).hexdigest(),'storage_key_preserved':'oval-sus-v1','checks':checks,'errors':errors,'summary':{'passed':len(checks),'total':6},'not_tested':['Native Safari','Physical mobile devices']}
          (root/'evidence/rename-branding.json').write_text(json.dumps(report,indent=2,ensure_ascii=False)+'\n')
          print(json.dumps(report['summary']))
          PY
      - name: Update checksums and publish verified changes
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, subprocess
          from pathlib import Path
          paths = subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          paths += ['evidence/rename-branding.json']
          lines = []
          for name in sorted(set(paths)):
              p = Path(name)
              if not name or name == 'SHA256SUMS' or name.startswith('.github/') or not p.is_file():
                  continue
              lines.append(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+name+'\n')
          Path('SHA256SUMS').write_text(''.join(lines))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html README.md SHA256SUMS evidence/README.md evidence/publish-smoke-local.json evidence/rename-branding.json screenshots/
          git diff --cached --check
          git commit -m 'Rename game to Trump Among Us; preserve saves and refresh verified screenshots'
          git push origin HEAD:main
